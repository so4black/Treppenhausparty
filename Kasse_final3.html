<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touch-Kasse THP</title>

<style>
/* ---------- Grundlayout ---------- */
html,body{height:100%;overflow:auto}
body{font-family:sans-serif;margin:0;padding:20px;background:#f7f7f7}
.container{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;height:100%}
.panel{flex:1 1 300px;min-width:320px;background:#fff;padding:20px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,.1);display:flex;flex-direction:column}
h2{margin:0 0 15px}

/* ---------- Kassierer-Bar ---------- */
#kassBar{background:#1d4ed8;color:#fff;padding:8px 20px;margin:-20px -20px 15px;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:12px;font-size:15px}
#kassBar select{border-radius:5px;padding:4px 8px;font-size:14px;border:none}
#syncStatus{margin-left:auto;font-size:12px;opacity:.8}

/* ---------- Warenkorb-Panel ---------- */
.cart-panel{max-height:100%}
.cart-box{flex:1 1 0;min-height:0;overflow-y:auto;margin-bottom:10px;padding:10px;border-radius:8px;background:#f9fafb;border:2px dashed #bbb}
.empty-cart{color:#999;text-align:center;margin-top:20px;font-style:italic}
#cartDiscount{font-weight:bold;margin:5px 0}

/* ---------- Linkes Panel ---------- */
.top-left{display:flex;gap:20px;flex-wrap:wrap}
.top-left>div{flex:1 1 220px;min-width:200px;display:flex;flex-direction:column}

/* ---------- Pads ---------- */
.number-pad{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:12px;width:100%}
.stats-line{background:#f0f0f0;border-radius:8px;font-size:14px;padding:6px 10px;white-space:nowrap;overflow:hidden}
.pay-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.number-button{font-size:20px;padding:15px;border:none;border-radius:8px;cursor:pointer;background:#74b9ff;color:#fff}
.number-button.highlight{box-shadow:0 0 0 3px #0984e3 inset}
.special-btn{background:#a29bfe}

/* ---------- Aktion-Spalte ---------- */
.action-col{display:flex;flex-direction:column;gap:10px;width:270px}
.action-col button{width:100%}
.quick-btn{font-size:18px;color:#000}
.quick-btn[data-val="10"]{background:#16a34a;color:#fff}
.quick-btn[data-val="20"]{background:#eab308}
.quick-btn[data-val="50"]{background:#dc5a21;color:#fff}

/* ---------- Buttons allgemein ---------- */
button{font-size:16px;border:none;border-radius:5px;padding:10px 15px;cursor:pointer}
.small-btn{background:#b2bec3;color:#2d3436;width:100%}
.danger-btn{background:#d63031;color:#fff;width:100%}
.pay-btn{background:#e17055;color:#fff;width:100%;font-size:18px}

/* ---------- Doppel-Buttons ---------- */
.pay-row{display:flex;gap:10px;margin-top:10px}
.pay-row button{flex:1}

/* ---------- Produkt-Grid ---------- */
#productButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.product-button{width:100%;padding:12px;font-size:16px;text-align:left;border-radius:8px;border:none;cursor:pointer;color:#fff}
.category{grid-column:1/-1;font-weight:bold;margin:20px 0 5px;font-size:16px}
.grayed-out{filter:grayscale(1);opacity:.6}

/* ---------- Warenkorb-Einträge ---------- */
.cart-item{display:grid;grid-template-columns:1fr 120px auto auto auto;align-items:center;gap:10px;font-size:16px;margin-bottom:8px}
.cart-sum{text-align:center}
button.cart-op{padding:0 8px;font-size:16px;background:#dfe6e9;color:#2d3436}
.disabled-cart{filter:grayscale(1);opacity:.4}

/* ---------- Bezahlbereich ---------- */
.pay-section{display:flex;gap:20px;align-items:flex-start}
.display-box{font-size:32px;padding:12px;border:1px solid #ccc;width:270px;text-align:right;background:#ecf0f1;border-radius:6px;margin-bottom:10px}
.totals-box{width:270px;background:#f1f2f6;border-radius:6px;padding:10px;margin-bottom:10px;font-size:20px}
.totals-box div{display:flex;justify-content:space-between}
.change{font-size:20px;font-weight:bold;color:#d63031}

/* ---------- Historie / Statistik ---------- */
.history-item{font-size:14px;border-bottom:1px solid #ccc;padding:3px 0}
#paymentHistory{max-height:120px;overflow-y:auto}
#statView{background:#f0f0f0;border-radius:8px;font-size:14px;padding:10px}

/* ---------- Sonstiges ---------- */
.remove-wrap{margin-top:auto;display:flex;gap:10px}
.discount-entry .panel{filter:grayscale(1) opacity(.4)}
.discount-entry .pay-section,.discount-entry .action-col{filter:none;opacity:1}
.display-box,.totals-box{border:2px solid #0984e3;box-shadow:0 0 10px rgba(0,132,227,.4);background:#fff}
.change.positive{color:#16a34a!important}
</style>

<!-- ==== Firebase Compat CDN ==== -->
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5wSCzf7cbCyi4NjMoDY8XD_FfAwl0LMw",
  authDomain: "kasse-thp.firebaseapp.com",
  databaseURL: "https://kasse-thp-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kasse-thp",
  storageBucket: "kasse-thp.appspot.com",
  messagingSenderId: "649959661531",
  appId: "1:649959661531:web:f48ac1a2a41bd7eff851fe"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// *** HIER deine Apps Script Web App URL eintragen nach dem Deployen ***
const SHEET_WEBHOOK_URL = "DEINE_APPS_SCRIPT_URL_HIER";

const products=[], categoryList={}, cart={}, soldStats={}, paymentHistory=[];
let soldRevenue=0;

db.ref('state').on('value', snap => {
  const s = snap.val();
  if (!s) return;
  products.length = 0;
  products.push(...(s.products || []));
  Object.assign(categoryList, s.categoryList || {});
  Object.assign(cart,         s.cart         || {});
  Object.assign(soldStats,    s.soldStats    || {});
  soldRevenue = s.soldRevenue || 0;
  paymentHistory.length = 0;
  paymentHistory.push(...(s.paymentHistory || []));
  if (typeof renderProducts === 'function') {
    renderProducts(); renderCart(); updateHistory();
  }
});

function persist() {
  db.ref('state').set({ products, categoryList, cart, soldStats, soldRevenue, paymentHistory });
}
window.addEventListener('beforeunload', persist);
window.addEventListener('unload', persist);

/* ---- Google Sheet Schreiben ---- */
function writeToSheet(data) {
  if (!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.startsWith("DEINE")) return;
  const syncEl = document.getElementById('syncStatus');
  syncEl.textContent = '⏳ Speichere...';
  fetch(SHEET_WEBHOOK_URL, {
    method: 'POST',
    body: JSON.stringify(data),
    headers: { 'Content-Type': 'text/plain' } // Apps Script braucht text/plain für no-cors
  })
  .then(r => r.json())
  .then(r => { syncEl.textContent = r.ok ? '✅ Gespeichert' : '⚠️ Fehler'; })
  .catch(() => { syncEl.textContent = '⚠️ Kein Internet?'; });
}
</script>
</head>
<body>

<div class="container">
  <!-- LINKES PANEL -->
  <div class="panel">
    <div id="kassBar">
      <span>👤 Kassierer:</span>
      <select id="kassSelect">
        <option>Freddy</option>
        <option>Divin</option>
        <option>Chrissi</option>
        <option>Jan</option>
        <option>Leul</option>
        <option>Sohrab</option>
        <option>Aldar</option>
        <option>Lorena</option>
        <option>Anna K.</option>
        <option>Michelle</option>
        <option>Finn</option>
      </select>
      <span id="syncStatus"></span>
    </div>
    <div class="top-left">
      <div>
        <h2>Anzahl</h2>
        <div id="quantityPad" class="number-pad"></div>
        <div id="statView" class="stats-line"></div>
      </div>
    </div>
    <div id="productButtons"></div>
  </div>

  <!-- RECHTES PANEL -->
  <div class="panel cart-panel">
    <h2>🛒 Warenkorb</h2>

    <div class="cart-box">
      <div id="cartItems"></div>
      <div id="cartDiscount"></div>
    </div>

    <div class="pay-section">
      <div>
        <div id="payAmountDisplay" class="display-box">0 €</div>
        <div class="totals-box">
          <div><span>Gesamt:</span><span id="total">0.00 €</span></div>
          <div class="change"><span>Rückgeld:</span><span id="change">0.00 €</span></div>
        </div>
        <div id="payPad" class="pay-pad"></div>
        <div class="pay-row">
          <button class="pay-btn" onclick="checkout()">Zahlung abschließen</button>
          <button class="danger-btn" onclick="cancelOrder()">Bestellung stornieren</button>
        </div>
      </div>
      <div class="action-col">
        <button id="discountBtn" class="small-btn" onclick="toggleDiscount()">Rabatt hinzufügen</button>
        <button class="small-btn" onclick="makeFree()">Rechnung gratis</button>
        <button class="quick-btn" data-val="10" onclick="quickPay(10)">10 €</button>
        <button class="quick-btn" data-val="20" onclick="quickPay(20)">20 €</button>
        <button class="quick-btn" data-val="50" onclick="quickPay(50)">50 €</button>
        <button class="quick-btn" onclick="exactPay()">Passend</button>
      </div>
    </div>

    <div style="margin:15px 0 5px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="small-btn" onclick="showFullHistory()">Alle Umsätze</button>
      <button class="small-btn" onclick="showStatsWindow()">Umsatzstatistik</button>
    </div>
    <div id="paymentHistory"></div>
  </div>
</div>

<script>
products.push(
  { name:'Bier', price:2.0, category:'Classics',  color:'#00b894' },
  { name:'Äppler 0,33', price:3.0, category:'Classics', color:'#0984e3' },
  { name:'+Pfand', price:0.5, category:'Classics', color:'#b6b904' },

  { name:'Shot', price:1.5, category:'Shots', color:'#0984e3' },
  { name:'Surprise Shot', price:0.5, category:'Shots', color:'#0984e3' },
  { name:'Happy Hour Shot', price:1.0, category:'Shots', color:'#0984e3' },

  { name:'Spezi', price:2.0, category:'alkoholfrei', color:'#00b894' },
  { name:'Mate',  price:3.0, category:'alkoholfrei', color:'#00b894' },
  { name:'+Pfand', price:0.5, category:'alkoholfrei', color:'#b6b904' },
  { name:'Limo 0,33', price:1.5, category:'alkoholfrei', color:'#0984e3' },
  { name:'Red Bull', price:3.0, category:'alkoholfrei', color:'#0984e3' },

  { name:'Sekt Mate', price:4.0, category:'Mischen', color:'#00b894' },
  { name:'Vodka Mate', price:4.0, category:'Mischen', color:'#00b894' },
  { name:'+Pfand', price:0.5, category:'Mischen', color:'#b6b904' },
  { name:'Koks Mische', price:5.0, category:'Mischen', color:'#0984e3' },

  { name:'Flasche Pfeffi', price:15.0, category:'Specials', color:'#0984e3' },
  { name:'Golfclub', price:15.0, category:'Specials', color:'#0984e3' },
  { name:'ACAB', price:110.0, category:'Specials', color:'#0984e3' },
  { name:'Bierpong', price:15.0, category:'Specials', color:'#0984e3' },
  { name:'Mischkonsum', price:15.0, category:'Specials', color:'#0984e3' },
  { name:'Schmeiße Runde', price:16.0, category:'Specials', color:'#0984e3' }
);

function rebuildCategories() {
  for (const k in categoryList) delete categoryList[k];
  products.forEach(p => (categoryList[p.category] = categoryList[p.category] || []).push(p));
}
rebuildCategories();

let selectedQuantity=1, payAmount="", discountInput="", freeInvoice=false, mode="pay", deleteMode=false;

const paymentHistoryEl=document.getElementById('paymentHistory');
const statView=document.getElementById('statView');
const nBtn=(txt,extra='')=>{const b=document.createElement('button');b.textContent=txt;b.className='number-button'+(extra?' '+extra:'');return b;};

function renderQuantityPad(){const pad=document.getElementById('quantityPad');pad.innerHTML='';['1','2','3','4','5','6','7','8','9','0','C'].forEach(l=>{const b=nBtn(l);b.onclick=()=>handleQuantity(l,b);pad.appendChild(b);});}
function handleQuantity(l,btn){if(l==='C'){selectedQuantity=1;document.querySelectorAll('#quantityPad .number-button').forEach(x=>x.classList.remove('highlight'));}else{selectedQuantity=+l;document.querySelectorAll('#quantityPad .number-button').forEach(x=>x.classList.remove('highlight'));btn.classList.add('highlight');}}

function renderProducts(){
  const wrap=document.getElementById('productButtons');wrap.innerHTML='';
  for(const cat in categoryList){
    wrap.insertAdjacentHTML('beforeend',`<div class="category">${cat}</div>`);
    categoryList[cat].forEach(p=>{
      const b=document.createElement('button');
      b.className='product-button';b.style.background=p.color;
      b.textContent=`${p.name} - ${p.price.toFixed(2)} €`;
      b.onclick=()=>{(cart[p.name]=cart[p.name]||{...p,quantity:0}).quantity+=selectedQuantity;selectedQuantity=1;renderCart();document.querySelectorAll('#quantityPad .number-button').forEach(x=>x.classList.remove('highlight'));persist();};
      wrap.appendChild(b);
    });
  }
}

function calcTotal(base){
  let d=0;if(discountInput)d=discountInput.endsWith('%')?base*(parseFloat(discountInput)/100||0):parseFloat(discountInput.replace(',','.'))||0;
  if(freeInvoice)d=base;return Math.max(0,base-d);
}
function renderCart(){
  const c=document.getElementById('cartItems');c.innerHTML='';let pre=0;
  for(const k in cart){
    const it=cart[k],sum=it.quantity*it.price;pre+=sum;
    const d=document.createElement('div');d.className='cart-item';
    d.innerHTML=`<span>${it.quantity}x ${it.name} à ${it.price.toFixed(2)} €</span><span class="cart-sum">= ${sum.toFixed(2)} €</span>`;
    ['+','-','✖'].forEach(sym=>{
      const b=document.createElement('button');b.className='cart-op';b.textContent=sym;
      if(sym==='+')b.onclick=()=>{it.quantity++;renderCart();persist();};
      else if(sym==='-')b.onclick=()=>{if(--it.quantity<=0)delete cart[k];renderCart();persist();};
      else b.onclick=()=>{delete cart[k];renderCart();persist();};
      d.appendChild(b);
    });
    c.appendChild(d);
  }
  if(Object.keys(cart).length===0)c.innerHTML='<div class="empty-cart">Warenkorb leer</div>';
  cartDiscount.textContent=freeInvoice?'Rabatt: 100 % (Rechnung gratis)':discountInput?`Rabatt: ${discountInput.endsWith('%')?discountInput:discountInput+' €'}`:'';
  total.textContent=calcTotal(pre).toFixed(2);
  c.classList.toggle('disabled-cart',freeInvoice);
  updateChange();renderStats();
}

function renderPayPad(){const pad=document.getElementById('payPad');pad.innerHTML='';['7','8','9','4','5','6','1','2','3','0','%','€','.','C','←'].forEach(l=>{const b=nBtn(l,(l==='€'||l==='%'?'special-btn':''));b.onclick=()=>handlePay(l);pad.appendChild(b);});}
function handlePay(l){if(l==='C'){mode==='discount'?discountInput='':payAmount='';}
else if(l==='←'){mode==='discount'?discountInput=discountInput.slice(0,-1):payAmount=payAmount.slice(0,-1);}
else if(l==='€'){if(mode==='discount'&&discountInput.endsWith('%'))discountInput=discountInput.slice(0,-1);}
else if(l==='%'){if(mode==='discount'&&!discountInput.endsWith('%'))discountInput+='%';}
else{mode==='discount'?discountInput+=l:payAmount+=l;}
updateDisplays();renderCart();}
function updateDisplays(){payAmountDisplay.textContent=mode==='discount'?'Rabatt: '+(discountInput.endsWith('%')?discountInput:(discountInput||'0')+' €'):(payAmount||'0')+' €';}
function updateChange(){const diff=parseFloat((payAmount||'0').replace(',','.'))-parseFloat(total.textContent);change.textContent=isNaN(diff)?'0.00 €':diff.toFixed(2)+' €';diff>0?change.classList.add('positive'):change.classList.remove('positive');}

function toggleDiscount(){if(mode!=='discount'){mode='discount';discountBtn.textContent='Rabatt speichern';document.body.classList.add('discount-entry');}
else{mode='pay';discountBtn.textContent='Rabatt hinzufügen';document.body.classList.remove('discount-entry');renderCart();updateDisplays();persist();}}
function makeFree(){freeInvoice=!freeInvoice;renderCart();persist();}
const quickPay=v=>{mode='pay';payAmount=String(v);updateDisplays();updateChange();};
function exactPay(){mode='pay';payAmount=parseFloat(total.textContent).toFixed(2);updateDisplays();updateChange();}

function cancelOrder(){if(confirm('Bestellung wirklich stornieren?')){for(const k in cart)delete cart[k];payAmount=discountInput='';freeInvoice=false;mode='pay';document.body.classList.remove('discount-entry');renderCart();updateDisplays();persist();}}

function checkout(){
  if(mode==='discount')toggleDiscount();
  const totalNum=parseFloat(total.textContent),recv=parseFloat((payAmount||'0').replace(',','.'))||0;
  if(!freeInvoice&&recv<totalNum){alert('Betrag zu gering!');return;}

  const changeVal=(recv-totalNum).toFixed(2);
  const itemList=Object.values(cart);
  const items=itemList.map(x=>`${x.quantity}x ${x.name}`).join(', ');
  const anzahlGesamt=itemList.reduce((s,x)=>s+x.quantity,0);
  const kassierer=document.getElementById('kassSelect').value;

  const entry=`${new Date().toLocaleTimeString()} [${kassierer}] - Gesamt: ${totalNum.toFixed(2)} €, Erhalten: ${recv.toFixed(2)} €, Rückgeld: ${changeVal} € | ${items}`;
  paymentHistory.unshift(entry);
  updateHistory();
  for(const k in cart)soldStats[k]=(soldStats[k]||0)+cart[k].quantity;
  soldRevenue+=totalNum;

  // ---- Google Sheet schreiben ----
  writeToSheet({
    produkte:      items,
    anzahl_gesamt: anzahlGesamt,
    betrag:        totalNum,
    erhalten:      recv,
    rueckgeld:     parseFloat(changeVal),
    rabatt:        freeInvoice ? '100%' : (discountInput || ''),
    kassierer:     kassierer
  });

  alert('Zahlung erfolgreich!\n'+entry);
  for(const k in cart)delete cart[k];
  payAmount=discountInput='';freeInvoice=false;
  renderCart();updateDisplays();persist();
}

function updateHistory(){paymentHistoryEl.innerHTML=paymentHistory.slice(0,5).map(e=>`<div class="history-item">${e}</div>`).join('');}
function renderStats(){const pieces=Object.values(soldStats).reduce((s,n)=>s+n,0);statView.textContent=`Transaktionen: ${paymentHistory.length}  •  Stück: ${pieces}  •  Umsatz: ${soldRevenue.toFixed(2)} €`;}

function showStatsWindow(){const w=open('','_blank'),pieces=Object.values(soldStats).reduce((s,n)=>s+n,0);w.document.write('<h2>Umsatzstatistik</h2><table border=1 cellpadding=6>');for(const p in soldStats)w.document.write(`<tr><td>${p}</td><td>${soldStats[p]}</td></tr>`);w.document.write(`<tr style="font-weight:bold"><td>Summe Stück</td><td>${pieces}</td></tr>`);w.document.write(`<tr style="font-weight:bold"><td>Gesamtumsatz (€)</td><td>${soldRevenue.toFixed(2)}</td></tr></table>`);}
function showFullHistory(){const w=open('','_blank');w.document.write('<h2>Alle Umsätze</h2>');paymentHistory.forEach(e=>w.document.write('<div>'+e+'</div>'));}

renderQuantityPad();renderPayPad();renderProducts();renderCart();
</script>
</body>
</html>
